services:
  postgres:
    image: postgres:16-alpine
    container_name: travelocount-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: travelocount
      POSTGRES_PASSWORD: travelocount
      POSTGRES_DB: travelocount
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
